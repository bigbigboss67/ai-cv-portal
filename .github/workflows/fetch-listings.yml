name: Fetch job listings

# A static site on GitHub Pages has nowhere to run a scheduled job, and both
# sources block cross-origin requests from the browser. Actions is the scheduler.
on:
  schedule:
    - cron: "0 4 * * *"      # 04:00 UTC - 08:00 in Dubai, after the previous working day is indexed
  workflow_dispatch:         # and a manual "Run workflow" button

permissions:
  contents: write            # needed to commit the refreshed listings back

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch listings
        # Repository secrets are not ambient environment variables — a step
        # only sees what it is handed. Without this mapping the websearch
        # source throws "AISA_API_KEY not set" even though the secret exists.
        env:
          AISA_API_KEY: ${{ secrets.AISA_API_KEY }}
        run: node scripts/fetch-listings.mjs

      - name: Show what changed
        run: |
          echo "--- data/listings.json ---"
          node -e "const d=require('./data/listings.json');console.log('generated',d.generatedAt,'total',d.total);for(const s of d.sources)console.log(' ',s.id,s.ok?('ok '+s.count):('FAILED '+s.error));"

      - name: Commit if the listings moved
        run: |
          git config user.name  "listings-bot"
          git config user.email "listings-bot@users.noreply.github.com"
          git add data/listings.json
          if git diff --staged --quiet; then
            echo "No change - nothing to commit."
          else
            git commit -m "chore: refresh job listings ($(date -u +%Y-%m-%d))"
            git push
          fi
